[project]
name = "khc-docs"
version = "0.1.0"
description = "Quản lý & tra cứu hồ sơ dự án KHC: Google Drive -> trích xuất (OCR) -> chỉ mục FTS5 -> MCP server cho Claude"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pyxlsb>=1.0.10",
    "python-pptx>=0.6.23",
    "pillow>=10",
    "pytesseract>=0.3.10",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4", "xlwt>=1.3"]

[project.scripts]
khc-docs = "khc_docs.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["khc_docs"]
